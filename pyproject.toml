[project]
name = "clash-of-bots"
dynamic = ["version"]
description = "Clash of Clans farming bot for LDPlayer (ADB + OpenCV)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "adbutils==2.12.0",
    "numpy>=2.2,<3",
    # headless: PySide6 ships its own Qt; opencv-python's bundled Qt plugins conflict with it.
    "opencv-python-headless>=4.12,<5",
    "pyside6-essentials==6.11.2",
    "pytesseract>=0.3.13",
    "segno>=1.6",
]

[project.scripts]
cob = "cob.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["nuitka==4.3.1", "zstandard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cob/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cob"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"cob/ui/style/qss.py" = ["E501"]  # one QSS rule per line reads better than wrapped

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
