# Cheap checks (Linux only) on pull requests into main. No runs on plain branch pushes or on main
# pushes: work lands on main via PR, so the PR run already covered those commits (D-012).
name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating v10 tag
        with:
          enable-cache: true
      # Qt needs a few system libraries even on the offscreen platform used by the GUI tests.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.13
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
