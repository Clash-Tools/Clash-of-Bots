# Reusable: Nuitka Linux build -> .deb, .rpm, AppImage, each smoke-tested where users run it.
# Called by release.yml and the opt-in build-linux.yml. Built on the oldest supported Ubuntu so the
# binary runs on any distro with glibc >= 2.35.
name: build-linux

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Upload the packages to this (draft) release instead of a workflow artifact"
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_VERSION: "20251108"
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      # Nuitka needs a shared libpython; the setup-python build has one, uv's standalone one does not.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating v10 tag
        with:
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf ccache libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --python 3.13 --group build
      - run: shellcheck scripts/build_linux.sh scripts/smoke_linux.sh packaging/linux/AppRun
      - id: ver
        run: echo "version=$(uv run python scripts/release.py current)" >> "$GITHUB_OUTPUT"
      - name: Packaging tools (pinned, checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o runtime-x86_64 "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64"
          sha256sum -c - <<EOF
          $NFPM_SHA256  nfpm.tar.gz
          $APPIMAGETOOL_SHA256  appimagetool
          $APPIMAGE_RUNTIME_SHA256  runtime-x86_64
          EOF
          tar -xzf nfpm.tar.gz nfpm
          chmod +x nfpm appimagetool
          echo "NFPM=$PWD/nfpm" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$PWD/runtime-x86_64" >> "$GITHUB_ENV"
      # Compiled C objects are reused across builds -> big cut in build minutes after the first run.
      - uses: actions/cache@v6
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-
      - name: Build + package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # appimagetool is itself an AppImage; runners may lack FUSE
        run: ./scripts/build_linux.sh "${{ steps.ver.outputs.version }}"
      # Each package installed where users run it: .deb on Ubuntu and .rpm on Fedora (clean containers on
      # this runner), the AppImage on the runner itself. In this job, so no artifact carries the
      # packages to another job (the artifact storage quota ran out, 2026-11-06).
      - name: Smoke test .deb (ubuntu:24.04)
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e QT_QPA_PLATFORM=offscreen ubuntu:24.04 bash -c '
            set -e; apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "./dist/ClashOfBots-'"$VERSION"'-x86_64.deb"
            ./scripts/smoke_linux.sh clashofbots '"$VERSION"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Smoke test .rpm (fedora:44)
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e QT_QPA_PLATFORM=offscreen fedora:44 bash -c '
            set -e; dnf install -y -q "./dist/ClashOfBots-'"$VERSION"'-x86_64.rpm"
            ./scripts/smoke_linux.sh clashofbots '"$VERSION"
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - name: Smoke test AppImage
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          QT_QPA_PLATFORM: offscreen
        run: |
          app="$PWD/dist/ClashOfBots-$VERSION-x86_64.AppImage"
          chmod +x "$app"
          if [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; then
            echo "FUSE present: mounting the AppImage"
          else
            echo "no FUSE: extract-and-run"
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          ./scripts/smoke_linux.sh "$app" "$VERSION"
      - name: Upload to the draft release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/ClashOfBots-* --clobber
      - uses: actions/upload-artifact@v7
        if: inputs.release_tag == ''
        continue-on-error: true  # a manual test build: a full artifact quota must not fail it
        with:
          name: linux-packages
          path: dist/ClashOfBots-*
          retention-days: 3  # releases keep their own copies; 14 days filled the storage quota
