# Template metadata for 1600x900 @ 240 DPI (D-006, D-008).
# region = [x, y, w, h] search area in frame pixels (smaller = faster, fewer false hits).
# threshold = min TM_CCOEFF_NORMED score. gray = false when only color tells it apart.
# PNGs are captured with: cob crop <frame.png> <name> x y w h   (prints a snippet for this file)
# Anchors cut from LDPlayer 14 frames, 2026-10-18 (CoC UI with Battle / Ranked Battle menu).

[defaults]
threshold = 0.85
gray = true

# HOME: yellow "Battle" button, bottom-left (sword + label, no border)
[templates.attack_button]
region = [15, 705, 180, 195]

# ATTACK_MENU: "Find a Match" label on the Multiplayer > Battle card (cost below it is left out)
[templates.find_match]
region = [135, 597, 280, 94]

# ARMY_TRAINING: the attack menu while the army trains: "Attack available in:" (grey) where "Find a Match"
# is otherwise (#180, moto g84 2026-11-06)
[templates.attack_available_label]
region = [123, 590, 298, 114]

# ARMY: "My Army" tab label. Phones draw dialogs ~2 % larger (moto g84: 0.84 at 1.0, 0.98 at 1.02).
[templates.army_tab_header]
region = [225, 47, 195, 90]
scales = [1.0, 1.02]

# SEARCHING: "for opponents" on the cloud screen (magnifier swings and dots animate, so both left out)
[templates.searching_text]
region = [722, 444, 340, 94]

# ARMY after Find a Match: green "Attack!" confirm (Edit Army shows a brown Battle button instead)
[templates.army_attack]
region = [1340, 751, 200, 96]
scales = [1.0, 1.02]

# SEARCH_BLOCKED: "Unable to attack Village! Try again later." on the cloud screen
[templates.search_blocked_text]
region = [437, 453, 350, 80]

# Return Home button on the cloud screen (searching and blocked)
[templates.clouds_return_home]
region = [15, 780, 185, 110]

# ATTACK_SEARCH: magnifier + "Next" (search cost below it is left out)
[templates.next_button]
