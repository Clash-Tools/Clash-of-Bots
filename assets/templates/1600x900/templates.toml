# ATTACK_SEARCH -> HOME: red "End Battle" (in battle the same button says Surrender)
[templates.end_battle]
region = [0, 615, 230, 110]

# BATTLE -> surrender: red "Surrender" (End Battle before any troop is deployed)
[templates.surrender_button]
region = [20, 630, 190, 80]

# SURRENDER_CONFIRM: "Surrender?" dialog title and its green Okay
[templates.surrender_title]
region = [625, 230, 350, 95]
scales = [1.0, 1.02]  # phones draw dialogs ~2 % larger: no match there, 6 s lost per surrender (#166)

[templates.okay_button]
region = [887, 535, 165, 90]
scales = [1.0, 1.02]

# BATTLE: "Overall Damage" label, only shown once the battle has started
[templates.overall_damage]
